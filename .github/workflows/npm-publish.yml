name: npm-publish

on:
  push:
    branches:
      - master
      - v2.0.0-alpha
    tags:
      - 'v*'
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test || true

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci

      # Determine dist-tag from version string
      # v2.0.0-alpha.3 → alpha, v2.0.0-beta.1 → beta, v2.0.0 → latest
      - name: Determine npm tag
        id: tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          if echo "$VERSION" | grep -q "alpha"; then
            echo "dist_tag=alpha" >> $GITHUB_OUTPUT
          elif echo "$VERSION" | grep -q "beta"; then
            echo "dist_tag=beta" >> $GITHUB_OUTPUT
          elif echo "$VERSION" | grep -q "rc"; then
            echo "dist_tag=next" >> $GITHUB_OUTPUT
          else
            echo "dist_tag=latest" >> $GITHUB_OUTPUT
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # Verify package.json version matches the tag
      - name: Verify version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${{ steps.tag.outputs.version }}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag (v$TAG_VERSION)"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --access public --tag ${{ steps.tag.outputs.dist_tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
